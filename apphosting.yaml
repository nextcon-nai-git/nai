# Configurações para gerenciar e configurar um backend do Firebase App Hosting.
# https://firebase.google.com/docs/app-hosting/configure

# Nome do ambiente: nai

runConfig:
  # Memória aumentada para 1Gi para evitar erros de Out of Memory (OOM) no Next.js 15
  memory: 1Gi
  # Aumente este valor se desejar criar automaticamente mais instâncias
  # em resposta ao aumento do tráfego.
  maxInstances: 1
