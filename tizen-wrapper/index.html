<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0">
    <title>NAI - Nextcon Saúde</title>
    <style>
        /* Tira qualquer borda branca e deixa a tela toda preta carregando */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
        }
        
        /* O Iframe é a janela mágica que vai carregar o seu sistema da internet */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <!-- Link para o domínio do sistema Nextcon -->
    <iframe id="app-frame" src="https://nai.nextconsaude.com.br"></iframe>

    <script>
        // Lógica para fechar o app na TV quando apertar o botão de voltar
        document.addEventListener('keydown', function(e) {
            
            // 10009: Samsung (Tizen), 461: LG (webOS)
            if (e.keyCode === 10009 || e.keyCode === 461) { 
                if(typeof tizen !== "undefined") {
                    tizen.application.getCurrentApplication().exit();
                }
                if(typeof webOS !== "undefined") {
                    window.close();
                }
            }
            
        });
    </script>
</body>
</html>
